openapi: 3.1.0
info:
  title: Nerkh API
  description: |
    API documentation for Nerkh services including currency, crypto, and gold prices.

    > **Version 2 (V2)** has been added. V2 endpoints include 24h change percentage (`ch_24h_percent`) and 24h price range (`24hour`). Simplified lite endpoints are also available under `/v2/prices/lite/`.

    ## Authentication Methods
    The API supports two authentication methods:

    1. **Bearer Token Authentication**
       - Use the `Authorization: Bearer YOUR_TOKEN` header
       - Token can be obtained from the auth endpoints
       - Suitable for long-term access

    2. **API Key Authentication**
       - Use the `x-api-key` query parameter
       - Format: `?x-api-key=YOUR_API_KEY`
       - Suitable for quick access and testing

    Choose the authentication method that best suits your needs. Both methods provide secure access to the API endpoints.

    ## API Routes

    ### V2

    #### All items
    - GET /v2/prices/json/all - Get all item prices with 24h change (JSON)
    - GET /v2/prices/xml/all - Get all item prices with 24h change (XML)

    #### Lite (Simplified)
    - GET /v2/prices/json/lite - Get all prices simplified (JSON)
    - GET /v2/prices/xml/lite - Get all prices simplified (XML)
    - GET /v2/prices/json/lite/currency - Get currency prices simplified (JSON)
    - GET /v2/prices/xml/lite/currency - Get currency prices simplified (XML)
    - GET /v2/prices/json/lite/gold - Get gold prices simplified (JSON)
    - GET /v2/prices/xml/lite/gold - Get gold prices simplified (XML)
    - GET /v2/prices/json/lite/crypto - Get crypto prices simplified (JSON)
    - GET /v2/prices/xml/lite/crypto - Get crypto prices simplified (XML)

    #### Gold
    - GET /v2/prices/json/gold - Get all gold prices with 24h change (JSON)
    - GET /v2/prices/xml/gold - Get all gold prices with 24h change (XML)
    - GET /v2/prices/json/gold/{gold} - Get specific gold price (JSON)
    - GET /v2/prices/xml/gold/{gold} - Get specific gold price (XML)

    Available gold types (V2): <span style="color: red">GOLD18K</span>, <span style="color: red">GOLD24K</span>, <span style="color: red">GOLD18K_STOCK</span>, <span style="color: red">OUNCE</span>, <span style="color: red">OUNCE_PLATINUM</span>, <span style="color: red">OUNCE_SILVER</span>, <span style="color: red">MAZANEH</span>, <span style="color: red">MESGHAL</span>, <span style="color: red">SEKE_EMAMI</span>, <span style="color: red">SEKE_BAHAR</span>, <span style="color: red">SEKE_NIM</span>, <span style="color: red">SEKE_ROB</span>, <span style="color: red">SEKE_1G</span>, <span style="color: red">SEKE_PRS100</span>, <span style="color: red">SEKE_PRS200</span>, <span style="color: red">SEKE_PRS400</span>, <span style="color: red">SEKE_PRS500</span>, <span style="color: red">SEKE_PRS700</span>, <span style="color: red">GOLD_FUTURES</span>, <span style="color: red">MILLI_GOLD18K</span>, <span style="color: red">TALASEA_GOLD_18K</span>, <span style="color: red">TECHNOGOLD_GOLD_18K</span>

    #### Currency
    - GET /v2/prices/json/currency - Get all currency prices with 24h change (JSON)
    - GET /v2/prices/xml/currency - Get all currency prices with 24h change (XML)
    - GET /v2/prices/json/currency/{currency} - Get specific currency price (JSON)
    - GET /v2/prices/xml/currency/{currency} - Get specific currency price (XML)

    Available currencies (V2): <span style="color: red">USD</span>, <span style="color: red">AED</span>, <span style="color: red">EUR</span>, <span style="color: red">GBP</span>, <span style="color: red">TRY</span>, <span style="color: red">QAR</span>, <span style="color: red">CHF</span>, <span style="color: red">CNY</span>, <span style="color: red">CAD</span>

    #### Crypto
    - GET /v2/prices/json/crypto - Get all crypto prices with 24h change (JSON)
    - GET /v2/prices/xml/crypto - Get all crypto prices with 24h change (XML)
    - GET /v2/prices/json/crypto/{crypto} - Get specific crypto price (JSON)
    - GET /v2/prices/xml/crypto/{crypto} - Get specific crypto price (XML)

    Available cryptocurrencies (V2): <span style="color: red">BTC</span>, <span style="color: red">ETH</span>, <span style="color: red">USDT</span>, <span style="color: red">XRP</span>, <span style="color: red">DOT</span>, <span style="color: red">ADA</span>, <span style="color: red">DASH</span>, <span style="color: red">DOGE</span>, <span style="color: red">BNB</span>, <span style="color: red">TRX</span>, <span style="color: red">LTC</span>

    #### Price History
    - GET /v2/prices/history/{type}/{symbol} - Get time-aligned price history for a symbol (JSON)
    - Supported types: `gold`, `currency`, `crypto`
    - The `range` query parameter selects the window and resolution: `24h`, `48h` (hourly points), `7d`, `14d`, `30d` (daily points)
    - The `limit` query parameter optionally caps the number of returned points (newest kept)

    ### V1

    #### All items
    - GET /v1/prices/json/all - Get all item prices (JSON)
    - GET /v1/prices/xml/all - Get all item prices (XML)

    #### Gold
    - GET /v1/prices/json/gold - Get all gold prices (JSON)
    - GET /v1/prices/xml/gold - Get all gold prices (XML)
    - GET /v1/prices/json/gold/{gold} - Get specific gold price (JSON)
    - GET /v1/prices/xml/gold/{gold} - Get specific gold price (XML)
    
    Available gold types (V1): <span style="color: red">GOLD18K</span>, <span style="color: red">GOLD24K</span>, <span style="color: red">OUNCE</span>, <span style="color: red">MAZANEH</span>, <span style="color: red">SEKE_EMAMI</span>, <span style="color: red">SEKE_BAHAR</span>, <span style="color: red">SEKE_NIM</span>, <span style="color: red">SEKE_ROB</span>, <span style="color: red">SEKE_1G</span>, <span style="color: red">SEKE_PRS100</span>, <span style="color: red">SEKE_PRS200</span>, <span style="color: red">SEKE_PRS400</span>, <span style="color: red">SEKE_PRS500</span>, <span style="color: red">SEKE_PRS700</span>

    #### Currency
    - GET /v1/prices/json/currency - Get all currency prices (JSON)
    - GET /v1/prices/xml/currency - Get all currency prices (XML)
    - GET /v1/prices/json/currency/{currency} - Get specific currency price (JSON)
    - GET /v1/prices/xml/currency/{currency} - Get specific currency price (XML)
    
    Available currencies (V1): <span style="color: red">USD</span>, <span style="color: red">EUR</span>, <span style="color: red">AED</span>, <span style="color: red">GBP</span>, <span style="color: red">TRY</span>

    #### Crypto
    - GET /v1/prices/json/crypto - Get all crypto prices (JSON)
    - GET /v1/prices/xml/crypto - Get all crypto prices (XML)
    - GET /v1/prices/json/crypto/{crypto} - Get specific crypto price (JSON)
    - GET /v1/prices/xml/crypto/{crypto} - Get specific crypto price (XML)
    
    Available cryptocurrencies (V1): <span style="color: red">BTC</span>, <span style="color: red">ETH</span>, <span style="color: red">USDT</span>, <span style="color: red">XRP</span>

    ### Common
    - GET /info - Get API information
    - POST /v1/auth/validate - Validate token
    - POST /v1/auth/validate - Expire token
    - POST /v1/auth/validate - Deactivate token

  version: 1.181.0
  contact:
    name: Nerkh API Support
    email: Info@nerkh.io

servers:
  - url: https://api.nerkh.io
    description: API v1
  - url: https://api.nerkh.io
    description: API v2

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: query
      name: x-api-key
      description: API key for authentication via query parameter
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication via Authorization header

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
        status:
          type: integer
          description: HTTP status code
      examples:
        invalidToken:
          value:
            error: "Invalid token"
            status: 401
        expiredToken:
          value:
            error: "Token has expired"
            status: 401
        deactivatedToken:
          value:
            error: "Token is deactivated"
            status: 401
        missingAuth:
          value:
            error: "Authorization header is required"
            status: 401
        invalidAuthFormat:
          value:
            error: "Authorization header must use Bearer scheme"
            status: 401
        emptyToken:
          value:
            error: "Token is required"
            status: 401

    NotFoundResponse:
      type: object
      properties:
        message:
          type: string
          description: Error message
        status:
          type: integer
          description: HTTP status code
      example:
        message: "Route not found"
        status: 404

    TokenResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token
        expires_in:
          type: integer
          description: Token expiration time in seconds
      example:
        token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        expires_in: 3600

    PriceResponse:
      type: object
      properties:
        price:
          type: number
          description: Current price
        timestamp:
          type: string
          format: date-time
          description: Price timestamp
        currency:
          type: string
          description: Currency code
      example:
        price: 1.2345
        timestamp: "2024-04-24T12:00:00Z"
        currency: "USD"

    RateLimitResponse:
      type: object
      properties:
        ip:
          type: string
          description: IP address
        level:
          type: integer
          description: Rate limit level
      example:
        ip: "192.168.1.1"
        level: 1

paths:
  /info:
    get:
      summary: Get API Information
      description: Get general information about the API
      tags:
        - Info
      responses:
        '200':
          description: Successful response
  


  /v1/auth/validate:
    post:
      summary: Validate token
      description: Validate a JWT token
      tags:
        - Auth
      security:
        - BearerAuth: []
      x-code-samples:
        - lang: curl
          source: |
            curl -X POST 'https://api.nerkh.io/v1/auth/token/validate' \
              -H 'Authorization: Bearer YOUR_TOKEN'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'

                type: object
                properties:
                  message:
                    type: string
                    description: Validation message
                  user:
                    type: object
                    properties:
                      first_name:
                        type: string
                        description: User's first name
                      last_name:
                        type: string
                        description: User's last name
              example:
                message: "Token is valid"
                user:
                  first_name: "FIRSTNAME"
                  last_name: "LASTNAME"
        '401':
          description: Token validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidToken:
                  $ref: '#/components/schemas/ErrorResponse/examples/invalidToken'
                expiredToken:
                  $ref: '#/components/schemas/ErrorResponse/examples/expiredToken'
                deactivatedToken:
                  $ref: '#/components/schemas/ErrorResponse/examples/deactivatedToken'
                missingAuth:
                  $ref: '#/components/schemas/ErrorResponse/examples/missingAuth'
                invalidAuthFormat:
                  $ref: '#/components/schemas/ErrorResponse/examples/invalidAuthFormat'
                emptyToken:
                  $ref: '#/components/schemas/ErrorResponse/examples/emptyToken'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'

  /v1/auth/token/expire:
    post:
      summary: Expire token
      description: Mark a token as expired
      tags:
        - Auth
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Token to expire
              example:
                token: "YOUR_TOKEN"
      x-code-samples:
        - lang: curl
          source: |
            curl -X POST 'https://api.nerkh.io/v1/auth/token/validate' \
              -H 'X-API-Key: YOUR_API_KEY' \
              -H 'Content-Type: application/json' \
              -d '{"token": "YOUR_TOKEN"}'
      responses:
        '200':
          description: Token expired successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
                example:
                  message: "Token expired successfully"
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid API key"
                status: 401
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'

  /v1/auth/token/deactivate:
    post:
      summary: Deactivate token
      description: Mark a token as deactivated
      tags:
        - Auth
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Token to deactivate
              example:
                token: "YOUR_TOKEN"
      x-code-samples:
        - lang: curl
          source: |
            curl -X POST 'https://api.nerkh.io/v1/auth/token/validate' \
              -H 'X-API-Key: YOUR_API_KEY' \
              -H 'Content-Type: application/json' \
              -d '{"token": "YOUR_TOKEN"}'
      responses:
        '200':
          description: Token deactivated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
                example:
                  message: "Token deactivated successfully"
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid API key"
                status: 401
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'

  # Currency Price Endpoints
  /v1/prices/json/currency:
    get:
      summary: Get all currency prices (JSON)
      description: Get current prices for all currencies in JSON format
      tags:
        - Currency Prices
      parameters:
        - name: x-api-key
          in: query
          required: true
          schema:
            type: string
          description: API key for authentication
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, xml]
            default: json
          description: Response format (json or xml)
        - name: timestamp
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include timestamp in response
      x-code-samples:
        - lang: curl
          source: |
            curl -X GET 'https://api.nerkh.io/v1/prices/json/currency' \
            --header 'Content-Type: application/json' \
              -H 'Authorization: Bearer YOUR_TOKEN'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        description: Success message
                        example: "Success"
                      status:
                        type: integer
                        description: HTTP status code
                        example: 200
                      timestamp:
                        type: integer
                        description: Unix timestamp
                        example: 1745786995
                      date:
                        type: string
                        description: Formatted date
                        example: "1404-02-08 00:19:55"
                      prices:
                        type: object
                        properties:
                          AED:
                            type: object
                            properties:
                              min:
                                type: object
                                properties:
                                  "1hour":
                                    type: string
                                    example: "22698"
                                  "12hour":
                                    type: string
                                    example: "22507"
                              max:
                                type: object
                                properties:
                                  "1hour":
                                    type: string
                                    example: "22725"
                                  "12hour":
                                    type: string
                                    example: "23011"
                              current:
                                type: string
                                example: "22725"
                              update:
                                type: string
                                example: "1404-02-08 00:18:32"
                          EUR:
                            type: object
                            properties:
                              min:
                                type: object
                                properties:
                                  "1hour":
                                    type: string
                                    example: "94707"
                                  "12hour":
                                    type: string
                                    example: "93852"
                              max:
                                type: object
                                properties:
                                  "1hour":
                                    type: string
                                    example: "95025"
                                  "12hour":
                                    type: string
                                    example: "96089"
                              current:
                                type: string
                                example: "94800"
                              update:
                                type: string
                                example: "1404-02-08 00:18:32"
                          USD:
                            type: object
                            properties:
                              min:
                                type: object
                                properties:
                                  "1hour":
                                    type: string
                                    example: "83133"
                                  "12hour":
                                    type: string
                                    example: "82435"
                              max:
                                type: object
                                properties:
                                  "1hour":
                                    type: string
                                    example: "83233"
                                  "12hour":
                                    type: string
                                    example: "84281"
                              current:
                                type: string
                                example: "83233"
                              update:
                                type: string
                                example: "1404-02-08 00:18:32"
              example:
                data:
                  message: "Success"
                  status: 200
                  timestamp: 1745786995
                  date: "1404-02-08 00:19:55"
                  prices:
                    AED:
                      min:
                        "1hour": "22698"
                        "12hour": "22507"
                      max:
                        "1hour": "22725"
                        "12hour": "23011"
                      current: "22725"
                      update: "1404-02-08 00:18:32"
                    EUR:
                      min:
                        "1hour": "94707"
                        "12hour": "93852"
                      max:
                        "1hour": "95025"
                        "12hour": "96089"
                      current: "94800"
                      update: "1404-02-08 00:18:32"
                    USD:
                      min:
                        "1hour": "83133"
                        "12hour": "82435"
                      max:
                        "1hour": "83233"
                        "12hour": "84281"
                      current: "83233"
                      update: "1404-02-08 00:18:32"
        '401':
          description: Unauthorized - API key is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "API key is required"
                status: 401
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'

  /v1/prices/xml/currency:
    get:
      summary: Get all currency prices (XML)
      description: Get current prices for all currencies in XML format
      tags:
        - Currency Prices
      security:
        - BearerAuth: []
      x-code-samples:
        - lang: curl
          source: |
            curl -X GET 'https://api.nerkh.io/v1/prices/xml/currency' \
            --header 'Content-Type: application/json' \
              -H 'Authorization: Bearer YOUR_TOKEN'
      responses:
        '200':
          description: Successful response
          content:
            application/xml:
              schema:
                type: string
                description: XML response containing currency prices
              example: |
                <?xml version="1.0" encoding="UTF-8"?>
                <prices>
                  <currency>
                    <code>USD</code>
                    <price>1.2345</price>
                    <timestamp>2024-04-24T12:00:00Z</timestamp>
                  </currency>
                  <currency>
                    <code>EUR</code>
                    <price>0.9876</price>
                    <timestamp>2024-04-24T12:00:00Z</timestamp>
                  </currency>
                </prices>
        '401':
          description: Token validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidToken:
                  $ref: '#/components/schemas/ErrorResponse/examples/invalidToken'
                expiredToken:
                  $ref: '#/components/schemas/ErrorResponse/examples/expiredToken'
                deactivatedToken:
                  $ref: '#/components/schemas/ErrorResponse/examples/deactivatedToken'
                missingAuth:
                  $ref: '#/components/schemas/ErrorResponse/examples/missingAuth'
                invalidAuthFormat:
                  $ref: '#/components/schemas/ErrorResponse/examples/invalidAuthFormat'
                emptyToken:
                  $ref: '#/components/schemas/ErrorResponse/examples/emptyToken'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'


  /v1/prices/json/currency/{currency}:
    get:
      summary: Get specific currency price (JSON)
      description: Get current price for a specific currency in JSON format
      tags:
        - Currency Prices
      security:
        - BearerAuth: []
      parameters:
        - name: currency
          in: path
          required: true
          schema:
            type: string
            description: Currency code (e.g., USD, EUR, AED)
      x-code-samples:
        - lang: curl
          source: |
            curl -X GET 'https://api.nerkh.io/v1/prices/json/currency/USD' \
            --header 'Content-Type: application/json' \
              -H 'Authorization: Bearer YOUR_TOKEN'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Success"
                      status:
                        type: integer
                        example: 200
                      timestamp:
                        type: integer
                        example: 1745478756
                      date:
                        type: string
                        example: "1404-02-04 10:42:36"
                      prices:
                        type: object
                        properties:
                          "1hour":
                            type: string
                            example: "81088"
                          "12hour":
                            type: string
                            example: "81337"
                          current:
                            type: string
                            example: "81088"
                          update:
                            type: string
                            example: "1404-02-04 10:41:56"
        '401':  
          description: Token validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidToken:
                  $ref: '#/components/schemas/ErrorResponse/examples/invalidToken'
                expiredToken:
                  $ref: '#/components/schemas/ErrorResponse/examples/expiredToken'
                deactivatedToken:
                  $ref: '#/components/schemas/ErrorResponse/examples/deactivatedToken'
                missingAuth:
                  $ref: '#/components/schemas/ErrorResponse/examples/missingAuth'
                invalidAuthFormat:
                  $ref: '#/components/schemas/ErrorResponse/examples/invalidAuthFormat'
                emptyToken:
                  $ref: '#/components/schemas/ErrorResponse/examples/emptyToken'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'

  /v1/prices/xml/currency/{currency}:
    get:
      summary: Get specific currency price (XML)
      description: Get current price for a specific currency in XML format
      tags:
        - Currency Prices
      security:
        - BearerAuth: []
      parameters:
        - name: currency
          in: path
          required: true
          schema:
            type: string
            description: Currency code (e.g., USD, EUR, AED)
      x-code-samples:
        - lang: curl
          source: |
            curl -X GET 'https://api.nerkh.io/v1/prices/xml/currency/USD' \
            --header 'Content-Type: application/json' \
              -H 'Authorization: Bearer YOUR_TOKEN'
      responses:
        '200':
          description: Successful response
          content:
            application/xml:
              schema:
                type: string
                description: XML response containing currency prices
              example: |
                <?xml version="1.0" encoding="UTF-8"?>
                <response>
                  <message>Success</message>
                  <status>200</status>
                  <timestamp>1745478584</timestamp>
                  <date>1404-02-04 10:39:44</date>
                  <prices>
                    <currency symbol="USD">
                      <current>81088</current>
                      <min>
                        <one_hour>81088</one_hour>
                        <twelve_hour>80800</twelve_hour>
                      </min>
                      <max>
                        <one_hour>81088</one_hour>
                        <twelve_hour>81337</twelve_hour>
                      </max>
