                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        description: Success message
                        example: "Success"
                      status:
                        type: integer
                        description: HTTP status code
                        example: 200
                      timestamp:
                        type: integer
                        description: Unix timestamp
                        example: 1745786995
                      date:
                        type: string
                        description: Formatted date
