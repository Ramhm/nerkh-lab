  # V2 Price History Endpoint
  /v2/prices/history/{type}/{symbol}:
    get:
      summary: "V2: Get price history (JSON)"
      description: |
        Get time-aligned price history for a symbol over a configurable window.

        Range-to-resolution mapping:
        - `24h` / `48h` - hourly points (default `24h`)
        - `7d` / `14d` / `30d` - daily points

        The `limit` query parameter optionally caps the number of returned points
        (when lower than the range default, the newest points are kept). Points are
        returned newest-first.
      tags:
        - Price History (V2)
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [gold, currency, crypto]
            description: Asset type
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            description: Symbol code (e.g., GOLD18K, USD, BTC)
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 48h, 7d, 14d, 30d]
            default: "24h"
          description: History window and resolution
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Maximum number of points to return (newest kept)
      x-code-samples:
        - lang: curl
          source: |
            curl -X GET 'https://api.nerkh.io/v2/prices/history/gold/GOLD18K?range=24h' \
            --header 'Content-Type: application/json' \
              -H 'Authorization: Bearer YOUR_TOKEN'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Success"
                      status:
                        type: integer
                        example: 200
                      count:
                        type: integer
                        example: 24
                      timestamp:
                        type: integer
                        example: 1745478756
                      date:
                        type: string
                        example: "1404-02-04 10:42:36"
                      symbol:
                        type: string
                        example: "GOLD18K"
                      range:
                        type: string
                        example: "24h"
                      prices:
                        type: array
                        description: History points, newest first
                        items:
                          type: object
                          properties:
                            timestamp:
                              type: integer
                              description: Unix timestamp for the point
                              example: 1745478756
                            price:
                              type: string
                              description: Price at that timestamp
                              example: "16435000000"
        '400':
          description: Invalid range or limit parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '401':
          description: Token validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: History not found for the given type/symbol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'


