<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نمونه اتصال به Nerkh API (V2 - all/json)</title>
  <style>
    body {
      font-family: Tahoma, sans-serif;
      margin: 24px;
      background: #f7f7f8;
      color: #222;
    }
    h1 { font-size: 20px; }
    #status { margin: 12px 0; font-weight: bold; }
    .error { color: #c62828; }
    .group { margin-top: 24px; }
    .group h2 { font-size: 17px; margin-bottom: 10px; }
    .group h2 span { font-size: 13px; color: #777; font-weight: normal; }
    .items {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }
    .item {
      background: #fff;
      border: 1px solid #e3e3e6;
      border-radius: 8px;
      padding: 12px;
    }
    .item .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .symbol { font-weight: bold; }
    .price { font-size: 18px; }
    .change { font-size: 13px; font-weight: bold; }
    .change.up { color: #2e7d32; }
    .change.down { color: #c62828; }
    .meta { font-size: 12px; color: #777; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>قیمت‌های Nerkh — نسخه ۲ (JSON)</h1>
  <p id="status">در حال دریافت داده...</p>
  <div id="prices"></div>

  <script>
    // ---------------------------------------------------------------
    // تنظیمات — این بخش را تغییر دهید
    // توجه: در پروژه واقعی توکن را در کد سمت مرورگر قرار ندهید؛
    // درخواست را از سرور خود ارسال کنید تا توکن افشا نشود.
    // ---------------------------------------------------------------
    const CONFIG = {
      BASE_URL: "https://api.nerkh.io",       // آدرس پایه API
      ENDPOINT: "/v2/prices/json/all",        // مسیر دریافت همه قیمت‌ها (V2 - JSON)
      API_TOKEN: "YOUR_TOKEN_HERE"            // توکن Bearer خود را اینجا قرار دهید
    };
    // ---------------------------------------------------------------

    // نام فارسی گروه‌ها برای نمایش
    const GROUPS = {
      gold: "طلا",
      currency: "ارز",
      crypto: "کریپتو"
    };

    const statusEl = document.getElementById("status");
    const pricesEl = document.getElementById("prices");

    // جداکننده هزارگان و ارقام فارسی برای قیمت
    function formatPrice(value) {
      const num = Number(value);
      return Number.isFinite(num) ? num.toLocaleString("fa-IR") : "-";
    }

    // نمایش درصد تغییر ۲۴ ساعته با علامت مثبت/منفی
    function formatChange(value) {
      const num = Number(value);
      if (!Number.isFinite(num)) return "-";
      const text = num.toLocaleString("fa-IR", { maximumFractionDigits: 2 });
      return (num > 0 ? "+" : "") + text + "٪";
    }

    // ساخت کارت هر آیتم (طلا، ارز یا کریپتو)
    function itemCard(symbol, item) {
      const change = Number(item.ch_24h_percent);
      const changeClass = change > 0 ? "up" : change < 0 ? "down" : "";
      return `
        <div class="item">
          <div class="row">
            <span class="symbol">${symbol}</span>
            <span class="change ${changeClass}">${formatChange(item.ch_24h_percent)}</span>
          </div>
          <div class="price">${formatPrice(item.current)}</div>
          <div class="meta">آخرین به‌روزرسانی: ${item.update || "-"}</div>
        </div>`;
    }

    // نمایش همه آیتم‌های پاسخ، گروه‌بندی‌شده
    function render(data) {
      const source = data.data?.prices || data.data || {};
      const groupKeys = Object.keys(GROUPS).filter((key) => source[key]);
      const total = data.data?.count ?? groupKeys.reduce((sum, key) => sum + Object.keys(source[key]).length, 0);

      statusEl.textContent = `دریافت ${total.toLocaleString("fa-IR")} آیتم با موفقیت ✅`;
      statusEl.className = "";

      pricesEl.innerHTML = groupKeys.map((key) => {
        const items = source[key];
        const symbols = Object.keys(items);
        const cards = symbols.map((symbol) => itemCard(symbol, items[symbol])).join("");
        return `
          <section class="group">
            <h2>${GROUPS[key]} <span>(${symbols.length.toLocaleString("fa-IR")} آیتم)</span></h2>
            <div class="items">${cards}</div>
          </section>`;
      }).join("");
    }

    async function fetchPrices() {
      // ساخت آدرس و هدر احراز هویت با توکن
      const url = CONFIG.BASE_URL + CONFIG.ENDPOINT;
      const headers = {
        Accept: "application/json",
        Authorization: "Bearer " + CONFIG.API_TOKEN
      };

      try {
        // ارسال درخواست به API
        const response = await fetch(url, { method: "GET", headers });

        // بررسی موفقیت پاسخ
        if (!response.ok) {
          throw new Error("خطای HTTP: " + response.status);
        }

        const data = await response.json();
        render(data);
      } catch (error) {
        // نمایش خطا در صورت شکست درخواست
        statusEl.textContent = "خطا: " + error.message;
        statusEl.className = "error";
        pricesEl.innerHTML = "";
      }
    }

    // اجرای نمونه هنگام باز شدن صفحه
    fetchPrices();
  </script>
</body>
</html>
